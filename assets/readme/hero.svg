<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Prompit — 呼之则来、挥之则去的 AI 小帮手</title>
  <desc id="desc">左侧是项目名与一句话介绍，右侧是按真实界面绘制的 Prompit 悬浮小窗：输入「你好，世界！」后得到翻译结果「Hello, world!」。</desc>

  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF243D"/>
      <stop offset="1" stop-color="#AD0013"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F5EC"/>
      <stop offset="1" stop-color="#F4EDDD"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bgGrad)"/>

  <!-- ======================= title block ======================= -->
  <g id="title-block" transform="translate(64 0)">
    <rect x="0" y="72" width="22" height="22" rx="6" fill="url(#redGrad)"/>
    <text x="11" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">P</text>
    <text x="34" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" letter-spacing="2" fill="#8B7F6D">AI 悬浮小窗 · 快捷键驱动</text>

    <text x="-4" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="82" font-weight="800" letter-spacing="-1" fill="#2C2620">Prompit</text>

    <text x="0" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2C2620">呼之则来、挥之则去的 AI 小帮手</text>
    <text x="0" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" fill="#8B7F6D">翻译 · 润色 · 问答，结果直接粘回光标处</text>
    <text x="0" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#A89C86">Windows · macOS · Linux</text>
  </g>

  <!-- ======================= floating window (real UI, 1.3x) =======================
       Drawn in the app's own CSS-pixel coordinate space (560 × 176) using its
       design tokens: bg #F8F7F4, surface rgba(0,0,0,.055), border rgba(0,0,0,.13),
       accent rgba(180,130,40,.9), radii 6/8/11. -->
  <g id="floating-window" transform="translate(420 101) scale(1.3)">
    <!-- window shadow -->
    <rect x="0" y="10" width="560" height="176" rx="11" fill="#2C2620" opacity="0.05"/>
    <rect x="0" y="4" width="560" height="176" rx="11" fill="#2C2620" opacity="0.05"/>
    <!-- window body -->
    <rect x="0" y="0" width="560" height="176" rx="11" fill="#F8F7F4"/>

    <!-- ── toolbar (y 16, h 28) ── -->
    <!-- mode button: translate mode, Languages icon -->
    <rect x="20" y="16" width="28" height="28" rx="6" fill="#B48228" fill-opacity="0.12" stroke="#B48228" stroke-opacity="0.25" stroke-width="1"/>
    <g transform="translate(27 23) scale(0.5833)" fill="none" stroke="#B48228" stroke-opacity="0.9" stroke-width="3.09" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
    </g>

    <rect x="56" y="22" width="1" height="12" fill="#000000" fill-opacity="0.13"/>

    <!-- model selector -->
    <rect x="64" y="16" width="150" height="28" rx="8" fill="#000000" fill-opacity="0.055"/>
    <path transform="translate(74 23)" d="M7 1 L8.7 5.3 13 7 8.7 8.7 7 13 5.3 8.7 1 7 5.3 5.3 Z" fill="#000000" fill-opacity="0.45"/>
    <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#000000" fill-opacity="0.48">aurora-2-mini</text>
    <g transform="translate(198 25) scale(0.4167)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </g>

    <rect x="222" y="22" width="1" height="12" fill="#000000" fill-opacity="0.13"/>

    <!-- language selector -->
    <rect x="230" y="16" width="53" height="28" rx="8" fill="#000000" fill-opacity="0.055"/>
    <g transform="translate(237 24.5) scale(0.4583)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.93" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
    </g>
    <text x="252" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="10" fill="#000000" fill-opacity="0.48">英</text>
    <g transform="translate(265 25) scale(0.4167)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </g>

    <!-- persona toggle + chevron (off state, joined pill) -->
    <rect x="291" y="16" width="52" height="28" rx="8" fill="#000000" fill-opacity="0.055"/>
    <rect x="320" y="22" width="1" height="16" fill="#000000" fill-opacity="0.08"/>
    <g transform="translate(300.5 24.5) scale(0.4583)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.93" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/>
    </g>
    <g transform="translate(327 25) scale(0.4167)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </g>

    <!-- dictionary toggle (off state) -->
    <rect x="351" y="16" width="28" height="28" rx="8" fill="#000000" fill-opacity="0.055"/>
    <g transform="translate(359.5 24.5) scale(0.4583)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.93" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M8 11h8"/><path d="M8 7h6"/>
    </g>

    <!-- right cluster: pin / settings / hide -->
    <g transform="translate(455 23) scale(0.5833)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.09" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3H4a2 2 0 0 0-2 2v16.286a.71.71 0 0 0 1.212.502l2.202-2.202A2 2 0 0 1 6.828 19H20a2 2 0 0 0 2-2v-4"/><path d="M16 3h6v6"/><path d="m16 9 6-6"/>
    </g>
    <g transform="translate(487 23) scale(0.5833)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.09" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
    <g transform="translate(519 23) scale(0.5833)" fill="none" stroke="#000000" stroke-opacity="0.48" stroke-width="3.09" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </g>

    <!-- ── input (y 50, h 38) ── -->
    <rect x="20" y="50" width="520" height="38" rx="8" fill="#000000" fill-opacity="0.055" stroke="#000000" stroke-opacity="0.13" stroke-width="1"/>
    <text x="34" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#000000" fill-opacity="0.88">你好，世界！</text>
    <rect x="115" y="60" width="2" height="17" rx="1" fill="#000000" fill-opacity="0.88"/>

    <!-- send button: paste-mode (result present), ClipboardPaste icon -->
    <rect x="509" y="57" width="24" height="24" rx="6" fill="#B48228" fill-opacity="0.8"/>
    <g transform="translate(514.5 62.5) scale(0.5417)" fill="none" stroke="#FFFFFF" stroke-width="3.32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 14h10"/><path d="M16 4h2a2 2 0 0 1 2 2v1.344"/><path d="m17 18 4-4-4-4"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/>
      <rect x="8" y="2" width="8" height="4" rx="1"/>
    </g>

    <!-- ── result block (y 94, h 46) ── -->
    <rect x="20" y="94" width="520" height="46" rx="8" fill="#B48228" fill-opacity="0.10" stroke="#B48228" stroke-opacity="0.40" stroke-width="1"/>
    <rect x="20" y="94" width="3" height="46" rx="1.5" fill="#B48228" fill-opacity="0.9"/>
    <text x="37" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#000000" fill-opacity="0.88">Hello, world!</text>

    <!-- ── AI disclaimer ── -->
    <text x="32" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="10.5" fill="#000000" fill-opacity="0.68">内容由 AI 生成，请仔细甄别</text>
  </g>
</svg>
